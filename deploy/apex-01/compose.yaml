services:
  collabora:
    image: ${SIMPHONI_SHEETS_IMAGE:?Set a reviewed repository@sha256 digest from artifacts.lock.json}
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "127.0.0.1:9980:9980"
    environment:
      aliasgroup1: "https://simphoni.ai:443,https://www.simphoni.ai:443"
      server_name: sheets.simphoni.ai
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:net.frame_ancestors=https://simphoni.ai https://www.simphoni.ai http://localhost:5173 http://127.0.0.1:5173
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=2g,mode=1777
    volumes:
      - ${SIMPHONI_SHEETS_RUNTIME_ROOT:?Set the reviewed runtime root}/coolwsd:/var/lib/coolwsd
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9980/hosting/discovery >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
