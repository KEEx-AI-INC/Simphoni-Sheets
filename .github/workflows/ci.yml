name: SimphoniSheets CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-and-extension-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --package-lock=false
      - run: npm test
      - run: npm run check
      - run: bash -n build/*.sh
